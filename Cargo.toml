# Author: Kuruma
# AMC Launcher (Aleph Minecraft Client Launcher) — workspace root manifest

[workspace]
resolver = "2"
members = [
    "crates/amc-core",
    "crates/amc-auth",
    "crates/amc-downloader",
    "crates/amc-minecraft",
    "crates/amc-mods",
    "crates/amc-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Kuruma", "Aleph Team"]
license = "GPL-3.0-or-later"
repository = "https://github.com/KurumaOfficial/Aleph-Minecraft-Client-Launcher.git"

[workspace.dependencies]
# Internal workspace crates
amc-core = { path = "crates/amc-core" }
amc-auth = { path = "crates/amc-auth" }
amc-downloader = { path = "crates/amc-downloader" }
amc-minecraft = { path = "crates/amc-minecraft" }
amc-mods = { path = "crates/amc-mods" }
amc-ui = { path = "crates/amc-ui" }

# Async runtime & network
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Diagnostics & errors
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Hashing & crypto
md-5 = "0.10"
sha1 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }

# GUI & Graphics (egui 0.29 + wgpu backend with fallback to glow)
egui = "0.29"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "wgpu", "glow", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
resvg = "0.44"
usvg = "0.44"
tiny-skia = "0.11"

# Utilities & Archives
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
walkdir = "2"
parking_lot = "0.12"
open = "5"
rfd = "0.15"

[package]
name = "amc-launcher"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Aleph Minecraft Client Launcher — Next-Gen Modular Minecraft Launcher"

[dependencies]
amc-core = { workspace = true }
amc-auth = { workspace = true }
amc-downloader = { workspace = true }
amc-minecraft = { workspace = true }
amc-mods = { workspace = true }
amc-ui = { workspace = true }
image = { workspace = true }

tokio = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_SystemInformation"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"

[profile.dev]
opt-level = 2
debug = true

[profile.dev.package."*"]
opt-level = 2
